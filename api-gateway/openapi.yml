openapi: 3.0.0
info:
  title: Social Network API
  description: API для социальной сети с управлением пользователями и постами
  version: 1.0.0

servers:
  - url: http://localhost:8000
    description: API Gateway

paths:
  /api/users/register:

    post:
      tags:
      - auth
      summary: Регистрация нового пользователя
      description: Создание нового пользователя с логином, паролем и электронной почтой
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistration'
      responses:
        '201':
          description: Пользователь успешно создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Некорректный ввод
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Пользователь с таким логином или email уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users/login:
    post:
      tags:
      - auth
      summary: Аутентификация пользователя
      description: Аутентификация по логину и паролю
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLogin'
      responses:
        '200':
          description: Успешная аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Неверные учетные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users/profile:

    get:
      tags:
        - profile
      summary: Получение профиля пользователя
      description: Получение всех данных профиля текущего пользователя
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Данные профиля
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - profile
      summary: Обновление профиля пользователя
      description: Обновление данных профиля текущего пользователя
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: Профиль успешно обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: Некорректный ввод
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/posts:
    post:
      tags:
        - posts
      summary: Создание поста
      description: Создание нового поста пользователем
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostCreate'
      responses:
        '201':
          description: Пост успешно создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: Некорректный ввод
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      tags:
        - posts
      summary: Получение списка постов
      description: Получение пагинированного списка постов
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Номер страницы
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: per_page
          in: query
          description: Количество постов на странице
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
        - name: tag
          in: query
          description: Фильтр по тегу
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Список постов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostList'
        '400':
          description: Некорректный ввод
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/posts/{post_id}:
    get:
      tags:
        - posts
      summary: Получение поста по ID
      description: Получение детальной информации о посте
      security:
        - bearerAuth: []
      parameters:
        - name: post_id
          in: path
          required: true
          description: ID поста
          schema:
            type: integer
      responses:
        '200':
          description: Информация о посте
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Доступ запрещен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Пост не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - posts
      summary: Обновление поста
      description: Обновление информации о посте
      security:
        - bearerAuth: []
      parameters:
        - name: post_id
          in: path
          required: true
          description: ID поста
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostUpdate'
      responses:
        '200':
          description: Пост успешно обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: Некорректный ввод
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Доступ запрещен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Пост не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - posts
      summary: Удаление поста
      description: Удаление поста по ID
      security:
        - bearerAuth: []
      parameters:
        - name: post_id
          in: path
          required: true
          description: ID поста
          schema:
            type: integer
      responses:
        '200':
          description: Пост успешно удален
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Post deleted successfully"
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Доступ запрещен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Пост не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
                
  # New endpoints for post views, likes, and comments
  /api/posts/{post_id}/view:
    post:
      tags:
        - post-interactions
      summary: Просмотр поста
      description: Регистрация просмотра поста пользователем
      security:
        - bearerAuth: []
      parameters:
        - name: post_id
          in: path
          required: true
          description: ID поста
          schema:
            type: integer
      responses:
        '200':
          description: Просмотр успешно зарегистрирован
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Post viewed successfully"
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Доступ запрещен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Пост не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/posts/{post_id}/like:
    post:
      tags:
        - post-interactions
      summary: Лайк/дизлайк поста
      description: Добавление или удаление лайка поста пользователем
      security:
        - bearerAuth: []
      parameters:
        - name: post_id
          in: path
          required: true
          description: ID поста
          schema:
            type: integer
      responses:
        '200':
          description: Лайк успешно добавлен или удален
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Post liked successfully"
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Доступ запрещен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Пост не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/posts/{post_id}/comments:
    post:
      tags:
        - comments
      summary: Создание комментария
      description: Добавление комментария к посту
      security:
        - bearerAuth: []
      parameters:
        - name: post_id
          in: path
          required: true
          description: ID поста
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCreate'
      responses:
        '201':
          description: Комментарий успешно создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          description: Некорректный ввод
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Доступ запрещен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Пост не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      tags:
        - comments
      summary: Получение комментариев поста
      description: Получение пагинированного списка комментариев к посту
      security:
        - bearerAuth: []
      parameters:
        - name: post_id
          in: path
          required: true
          description: ID поста
          schema:
            type: integer
        - name: page
          in: query
          description: Номер страницы
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: per_page
          in: query
          description: Количество комментариев на странице
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Список комментариев
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentList'
        '400':
          description: Некорректный ввод
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Пост не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/statistics/posts/{post_id}/stats:
    get:
      tags:
        - statistics
      summary: Получение общей статистики поста
      description: Получение количества просмотров, лайков и комментариев по посту
      security:
        - bearerAuth: []
      parameters:
        - name: post_id
          in: path
          required: true
          description: ID поста
          schema:
            type: integer
      responses:
        '200':
          description: Статистика поста
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostStats'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/statistics/posts/{post_id}/dynamics/views:
    get:
      tags:
        - statistics
      summary: Динамика просмотров поста
      description: Получение динамики просмотров по дням
      security:
        - bearerAuth: []
      parameters:
        - name: post_id
          in: path
          required: true
          description: ID поста
          schema:
            type: integer
        - name: start_date
          in: query
          description: Начальная дата (YYYY-MM-DD)
          required: false
          schema:
            type: string
            format: date
            example: "2025-01-01"
        - name: end_date
          in: query
          description: Конечная дата (YYYY-MM-DD)
          required: false
          schema:
            type: string
            format: date
            example: "2025-05-25"
      responses:
        '200':
          description: Динамика просмотров
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDynamics'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/statistics/posts/{post_id}/dynamics/likes:
    get:
      tags:
        - statistics
      summary: Динамика лайков поста
      description: Получение динамики лайков по дням
      security:
        - bearerAuth: []
      parameters:
        - name: post_id
          in: path
          required: true
          description: ID поста
          schema:
            type: integer
        - name: start_date
          in: query
          description: Начальная дата (YYYY-MM-DD)
          required: false
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          description: Конечная дата (YYYY-MM-DD)
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Динамика лайков
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDynamics'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/statistics/posts/{post_id}/dynamics/comments:
    get:
      tags:
        - statistics
      summary: Динамика комментариев поста
      description: Получение динамики комментариев по дням
      security:
        - bearerAuth: []
      parameters:
        - name: post_id
          in: path
          required: true
          description: ID поста
          schema:
            type: integer
        - name: start_date
          in: query
          description: Начальная дата (YYYY-MM-DD)
          required: false
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          description: Конечная дата (YYYY-MM-DD)
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Динамика комментариев
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDynamics'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/statistics/posts/top:
    get:
      tags:
        - statistics
      summary: Топ постов
      description: Получение топ постов по метрике (просмотры, лайки или комментарии)
      security:
        - bearerAuth: []
      parameters:
        - name: metric
          in: query
          description: Метрика для сортировки
          required: false
          schema:
            type: string
            enum: [views, likes, comments]
            default: views
        - name: limit
          in: query
          description: Количество постов в топе
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Топ постов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopPosts'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/statistics/users/top:
    get:
      tags:
        - statistics
      summary: Топ пользователей
      description: Получение топ пользователей по метрике (просмотры, лайки или комментарии)
      security:
        - bearerAuth: []
      parameters:
        - name: metric
          in: query
          description: Метрика для сортировки
          required: false
          schema:
            type: string
            enum: [views, likes, comments]
            default: views
        - name: limit
          in: query
          description: Количество пользователей в топе
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Топ пользователей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopUsers'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UserRegistration:
      type: object
      required:
        - username
        - password
        - email
      properties:
        username:
          type: string
          example: johndoe
          minLength: 3
          maxLength: 50
        password:
          type: string
          format: password
          example: Password123!
          minLength: 8
          maxLength: 100
        email:
          type: string
          format: email
          example: john.doe@example.com

    UserLogin:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: johndoe
        password:
          type: string
          format: password
          example: Password123!

    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user_id:
          type: integer
          example: 1
        username:
          type: string
          example: johndoe

    UserResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: johndoe
        email:
          type: string
          format: email
          example: john.doe@example.com
        created_at:
          type: string
          format: date-time
          example: '2023-03-29T12:00:00Z'

    UserProfile:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: johndoe
        email:
          type: string
          format: email
          example: john.doe@example.com
        first_name:
          type: string
          example: John
        last_name:
          type: string
          example: Doe
        birth_date:
          type: string
          format: date
          example: '1990-01-01'
        phone_number:
          type: string
          example: '+79001234567'
        address:
          type: string
          example: 'Moscow, Russia'
        created_at:
          type: string
          format: date-time
          example: '2023-03-29T12:00:00Z'
        updated_at:
          type: string
          format: date-time
          example: '2023-03-29T12:00:00Z'

    ProfileUpdate:
      type: object
      properties:
        first_name:
          type: string
          example: John
        last_name:
          type: string
          example: Doe
        birth_date:
          type: string
          format: date
          example: '1990-01-01'
        phone_number:
          type: string
          example: '+79001234567'
        address:
          type: string
          example: 'Moscow, Russia'
        email:
          type: string
          format: email
          example: john.doe@example.com

    PostCreate:
      type: object
      required:
        - title
        - description
      properties:
        title:
          type: string
          example: "My First Post"
          minLength: 1
          maxLength: 255
        description:
          type: string
          example: "This is the content of my first post in the social network."
        is_private:
          type: boolean
          default: false
          example: false
        tags:
          type: array
          items:
            type: string
          example: ["social", "first-post"]

    PostUpdate:
      type: object
      properties:
        title:
          type: string
          example: "Updated Post Title"
          minLength: 1
          maxLength: 255
        description:
          type: string
          example: "Updated content of my post."
        is_private:
          type: boolean
          example: true
        tags:
          type: array
          items:
            type: string
          example: ["updated", "social"]

    Post:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: "My First Post"
        description:
          type: string
          example: "This is the content of my first post in the social network."
        user_id:
          type: integer
          example: 1
        is_private:
